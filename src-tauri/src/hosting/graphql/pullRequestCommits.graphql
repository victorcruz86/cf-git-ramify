fragment actorInfo on Actor {
...nodeInfo
__typename
login
url
avatarUrl
... on User {
name
}
}
fragment gitActorInfo on GitActor {
name
email
avatarUrl
date
user {
__typename
...actorInfo
}
}
fragment commitHash on Commit {
...nodeInfo
oid
abbreviatedOid
}
fragment commitShort on Commit {
...commitHash
url
messageHeadlineHTML
author {
...gitActorInfo
}
}
fragment commit on Commit {
...commitShort
committer {
...gitActorInfo
}
messageHeadline
messageBodyHTML
committedDate
parents(first: 100) {
nodes {
...commitHash
}
}
}
fragment nodeInfo on Node {
id
}
fragment pageInfo on PageInfo {
startCursor
hasPreviousPage
endCursor
hasNextPage
}
query($repoOwner: String!, $repoName: String!, $number: Int!, $pageSize: Int = 100, $cursor: String) {
repository(owner: $repoOwner, name: $repoName) {
pullRequest(number: $number) {
commits(first: $pageSize, after: $cursor) {
pageInfo {
...pageInfo
}
nodes {
...nodeInfo
commit {
...commit
}
url
}
}
}
}
}
