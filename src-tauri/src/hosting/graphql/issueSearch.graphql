fragment reaction on Reaction {
content
user {
...userInfo
}
}
fragment reactions on Reactable {
reactions(first: 25) {
pageInfo {
...pageInfo
}
nodes {
...reaction
}
}
}
fragment pullRequestReview on PullRequestReview {
__typename
...nodeInfo
url
author {
...actorInfo
}
body
state
createdAt
viewerCanUpdate
}
fragment teamInfo on Team {
__typename
...nodeInfo
slug
url
avatarUrl
name
combinedSlug
}
fragment pullRequestReviewerInfo on RequestedReviewer {
__typename
... on User {
...userInfo
}
... on Team {
...teamInfo
}
}
fragment labelInfo on Label {
...nodeInfo
url
name
color
}
fragment userInfo on User {
...actorInfo
}
fragment actorInfo on Actor {
...nodeInfo
__typename
login
url
avatarUrl
... on User {
name
}
}
fragment nodeInfo on Node {
id
}
fragment pullRequestInfoShort on PullRequest {
...nodeInfo
url
number

title
state
isDraft

author {
...actorInfo
}
createdAt
updatedAt

isReadByViewer

assignees(first: 100) {
nodes {
...userInfo
}
}
labels(first: 100) {
nodes {
...labelInfo
}
}
reviewRequests(first: 100) {
nodes {
... on ReviewRequest {
requestedReviewer {
...pullRequestReviewerInfo
}
}
}
}
reviewThreads(last: 100) {
nodes {
isResolved
isOutdated
}
}
reviews(last: 100) {
nodes {
...pullRequestReview
}
}
...reactions

mergeable

viewerCanUpdate
viewerCanReact
viewerDidAuthor
}
fragment pageInfo on PageInfo {
startCursor
hasPreviousPage
endCursor
hasNextPage
}
query issueSearch($query: String!, $pageSize: Int = 100, $cursor: String) {
search(first: $pageSize, after: $cursor, type: ISSUE, query: $query) {
pageInfo {
...pageInfo
}
nodes {
...pullRequestInfoShort
}
}
}
