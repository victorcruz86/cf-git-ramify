fragment gitRefName on Ref {
name
}
fragment repositoryOwnerName on RepositoryOwner {
__typename
...nodeInfo
login
}
fragment repository on Repository {
...nodeInfo
owner {
...repositoryOwnerName
}
nameWithOwner
viewerPermission

mergeCommitAllowed
squashMergeAllowed
rebaseMergeAllowed

defaultBranchRef {
...gitRefName
}
isFork
url
sshUrl
}
fragment refUpdateRule on RefUpdateRule {
allowsDeletions
allowsForcePushes
pattern
requiredApprovingReviewCount
requiredStatusCheckContexts
requiresLinearHistory
requiresSignatures
viewerCanPush
}
fragment reaction on Reaction {
content
user {
...userInfo
}
}
fragment pageInfo on PageInfo {
startCursor
hasPreviousPage
endCursor
hasNextPage
}
fragment reactions on Reactable {
reactions(first: 25) {
pageInfo {
...pageInfo
}
nodes {
...reaction
}
}
}
fragment pullRequestReview on PullRequestReview {
__typename
...nodeInfo
url
author {
...actorInfo
}
body
state
createdAt
viewerCanUpdate
}
fragment teamInfo on Team {
__typename
...nodeInfo
slug
url
avatarUrl
name
combinedSlug
}
fragment pullRequestReviewerInfo on RequestedReviewer {
__typename
... on User {
...userInfo
}
... on Team {
...teamInfo
}
}
fragment labelInfo on Label {
...nodeInfo
url
name
color
}
fragment userInfo on User {
...actorInfo
}
fragment actorInfo on Actor {
...nodeInfo
__typename
login
url
avatarUrl
... on User {
name
}
}
fragment nodeInfo on Node {
id
}
fragment pullRequestInfoShort on PullRequest {
...nodeInfo
url
number

title
state
isDraft

author {
...actorInfo
}
createdAt
updatedAt

isReadByViewer

assignees(first: 100) {
nodes {
...userInfo
}
}
labels(first: 100) {
nodes {
...labelInfo
}
}
reviewRequests(first: 100) {
nodes {
... on ReviewRequest {
requestedReviewer {
...pullRequestReviewerInfo
}
}
}
}
reviewThreads(last: 100) {
nodes {
isResolved
isOutdated
}
}
reviews(last: 100) {
nodes {
...pullRequestReview
}
}
...reactions

mergeable

viewerCanUpdate
viewerCanReact
viewerDidAuthor
}
fragment pullRequestInfo on PullRequest {
...pullRequestInfoShort

body

author {
...actorInfo
}
createdAt

reviewDecision

baseRef {
refUpdateRule {
...refUpdateRule
}
}
baseRefName
baseRefOid
baseRepository {
...repository
}

headRefName
headRefOid
headRepository {
...repository
}
}
query($repoOwner: String!, $repoName: String!, $number: Int!) {
repository(owner: $repoOwner, name: $repoName) {
pullRequest(number: $number) {
...pullRequestInfo
}
}
}
