<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BA26A"/>
      <stop offset="1" stop-color="#145037"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06281A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Body on the macOS icon grid: 824 x 824 inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- A trunk that ramifies: three branches, like the log graph -->
  <g filter="url(#lift)" fill="none" stroke-linecap="round" stroke-width="42">
    <path d="M512 700 C512 616 324 616 324 532 V476" stroke="#FFD27A"/>
    <path d="M512 540 C512 456 700 456 700 372 V304" stroke="#9EF0C4"/>
    <path d="M512 780 V244" stroke="#FFFFFF"/>
  </g>

  <!-- Commits -->
  <g stroke="#1B6343" stroke-width="16" filter="url(#lift)">
    <circle cx="512" cy="780" r="50" fill="#FFFFFF"/>
    <circle cx="512" cy="410" r="40" fill="#FFFFFF"/>
    <circle cx="512" cy="244" r="50" fill="#FFFFFF"/>
    <circle cx="324" cy="476" r="50" fill="#FFD27A"/>
    <circle cx="700" cy="304" r="50" fill="#9EF0C4"/>
  </g>
</svg>
