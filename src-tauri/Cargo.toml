[package]
name = "rama"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"

[lib]
name = "rama_lib"
crate-type = ["rlib"]

[[bin]]
name = "rama"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
sha2 = "0.11"
quick-xml = "0.42"
tempfile = "3"
similar = "3"
libc = "0.2"
regex = "1"
tauri-plugin-dialog = "=2.8.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
